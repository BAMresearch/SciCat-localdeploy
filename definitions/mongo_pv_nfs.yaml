kind: PersistentVolume
apiVersion: v1
metadata:
  name: pvmongo10g
  labels:
    type: local
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  mountOptions:
    - hard
    - sync
    - vers=4.2
  nfs:
    path: /nfs/mongodb
    server: 10.0.9.1
---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: pvmongo5g
  labels:
    type: local
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  mountOptions:
    - hard
    - sync
    - vers=4.2
  nfs:
    path: /nfs/mongodb
    server: 10.0.9.1
